

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Completo de Empresa</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- CSS externo -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>

  <main class="container">
    <header class="header">
      <div class="icon-box">
        <i data-lucide="building-2"></i>
      </div>
      <h1>Cadastro de Empresa</h1>
      <p>Preencha as informações abaixo para cadastrar sua empresa na plataforma.</p>
    </header>

    <form id="formulario">
      
      <!-- Seção 1: Dados Jurídicos e Operacionais -->
      <section class="form-section">
        <h2 class="section-title">
          <i data-lucide="briefcase"></i>
          1. Dados Gerais da Empresa
        </h2>

        <div class="grid grid-2">
          <div class="form-group span-2-mobile">
            <label for="cnpj">CNPJ *</label>
            <div class="input-wrapper">
              <i data-lucide="file-text" class="input-icon"></i>
              <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" maxlength="18" value="12.345.678/0001-90" required>
            </div>
          </div>

          <div class="form-group span-2-mobile">
            <label for="razao_social">Razão Social *</label>
            <div class="input-wrapper">
              <i data-lucide="building" class="input-icon"></i>
              <input type="text" id="razao_social" name="razao_social" placeholder="Ex: Tech Solutions LTDA" value="Tech Solutions Tecnologia LTDA" required>
            </div>
          </div>

          <div class="form-group">
            <label for="nome_fantasia">Nome Fantasia</label>
            <div class="input-wrapper">
              <i data-lucide="store" class="input-icon"></i>
              <input type="text" id="nome_fantasia" name="nome_fantasia" placeholder="Ex: TechSolutions" value="TechSolutions Brasil">
            </div>
          </div>

          <div class="form-group">
            <label for="inscricao_estadual">Inscrição Estadual</label>
            <div class="input-wrapper">
              <i data-lucide="file-check" class="input-icon"></i>
              <input type="text" id="inscricao_estadual" name="inscricao_estadual" placeholder="Ex: 123.456.789.110 ou ISENTO" value="ISENTO">
            </div>
          </div>

          <div class="form-group">
            <label for="ramo_atividade">Ramo de Atuação *</label>
            <div class="input-wrapper">
              <i data-lucide="tag" class="input-icon"></i>
              <select id="ramo_atividade" name="ramo_atividade" required>
                <option value="" disabled>Selecione um ramo...</option>
                <option value="Tecnologia / Software" selected>Tecnologia / Software</option>
                <option value="Comércio / Varejo">Comércio / Varejo</option>
                <option value="Serviços Prestados">Serviços Prestados</option>
                <option value="Indústria / Manufatura">Indústria / Manufatura</option>
                <option value="Alimentação / Gastronomia">Alimentação / Gastronomia</option>
                <option value="Saúde / Bem-estar">Saúde / Bem-estar</option>
                <option value="Educação">Educação</option>
                <option value="Outro">Outro</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="porte_empresa">Porte da Empresa *</label>
            <div class="input-wrapper">
              <i data-lucide="pie-chart" class="input-icon"></i>
              <select id="porte_empresa" name="porte_empresa" required>
                <option value="" disabled>Selecione o porte...</option>
                <option value="MEI">MEI (Microempreendedor)</option>
                <option value="ME">ME (Microempresa)</option>
                <option value="EPP" selected>EPP (Empresa de Pequeno Porte)</option>
                <option value="Médio / Grande Porte">Médio / Grande Porte</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="num_funcionarios">Nº de Funcionários</label>
            <div class="input-wrapper">
              <i data-lucide="users" class="input-icon"></i>
              <select id="num_funcionarios" name="num_funcionarios">
                <option value="1-5">1 a 5 colaboradores</option>
                <option value="6-20" selected>6 a 20 colaboradores</option>
                <option value="21-50">21 a 50 colaboradores</option>
                <option value="50+">Mais de 50 colaboradores</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="faturamento_anual">Previsão Faturamento Anual</label>
            <div class="input-wrapper">
              <i data-lucide="dollar-sign" class="input-icon"></i>
              <select id="faturamento_anual" name="faturamento_anual">
                <option value="Até R$ 81 mil">Até R$ 81.000</option>
                <option value="R$ 81 mil a R$ 360 mil">R$ 81.000 a R$ 360.000</option>
                <option value="R$ 360 mil a R$ 4.8 milhão" selected>R$ 360.000 a R$ 4.800.000</option>
                <option value="Acima de R$ 4.8 milhão">Acima de R$ 4.800.000</option>
              </select>
            </div>
          </div>

          <div class="form-group span-2-mobile">
            <label for="website">Website / Redes Sociais</label>
            <div class="input-wrapper">
              <i data-lucide="globe" class="input-icon"></i>
              <input type="url" id="website" name="website" placeholder="https://suaempresa.com.br" value="https://techsolutions.exemplo.com.br">
            </div>
          </div>
        </div>
      </section>

      <!-- Seção 2: Contato & Responsável -->
      <section class="form-section">
        <h2 class="section-title">
          <i data-lucide="user-check"></i>
          2. Contato do Responsável
        </h2>

        <div class="grid grid-2">
          <div class="form-group">
            <label for="nome_responsavel">Nome do Responsável *</label>
            <div class="input-wrapper">
              <i data-lucide="user" class="input-icon"></i>
              <input type="text" id="nome_responsavel" name="nome_responsavel" placeholder="Ex: Carlos Andrade" value="Carlos Eduardo Andrade" required>
            </div>
          </div>

          <div class="form-group">
            <label for="cargo">Cargo / Função</label>
            <div class="input-wrapper">
              <i data-lucide="award" class="input-icon"></i>
              <input type="text" id="cargo" name="cargo" placeholder="Ex: Diretor de Operações" value="Diretor de Operações">
            </div>
          </div>

          <div class="form-group">
            <label for="email">E-mail Corporativo *</label>
            <div class="input-wrapper">
              <i data-lucide="mail" class="input-icon"></i>
              <input type="email" id="email" name="email" placeholder="carlos@empresa.com.br" value="carlos.andrade@techsolutions.com.br" required>
            </div>
          </div>

          <div class="form-group">
            <label for="telefone">Telefone / WhatsApp *</label>
            <div class="input-wrapper">
              <i data-lucide="phone" class="input-icon"></i>
              <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15" value="(11) 98765-4321" required>
            </div>
          </div>
        </div>
      </section>

      <!-- Seção 3: Endereço -->
      <section class="form-section">
        <h2 class="section-title">
          <i data-lucide="map-pin"></i>
          3. Endereço da Sede
        </h2>

        <div class="grid grid-3">
          <div class="form-group col-cep">
            <label for="cep">CEP *</label>
            <div class="input-wrapper">
              <i data-lucide="search" class="input-icon"></i>
              <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" value="01310-100" required>
            </div>
          </div>

          <div class="form-group col-logradouro">
            <label for="logradouro">Logradouro / Rua *</label>
            <div class="input-wrapper">
              <input type="text" id="logradouro" name="logradouro" placeholder="Avenida Paulista" value="Avenida Paulista" required>
            </div>
          </div>

          <div class="form-group col-numero">
            <label for="numero">Número *</label>
            <div class="input-wrapper">
              <input type="text" id="numero" name="numero" placeholder="1000" value="1000" required>
            </div>
          </div>
        </div>

        <div class="grid grid-3 mt-10">
          <div class="form-group">
            <label for="bairro">Bairro *</label>
            <div class="input-wrapper">
              <input type="text" id="bairro" name="bairro" placeholder="Bela Vista" value="Bela Vista" required>
            </div>
          </div>

          <div class="form-group">
            <label for="cidade">Cidade *</label>
            <div class="input-wrapper">
              <input type="text" id="cidade" name="cidade" placeholder="São Paulo" value="São Paulo" required>
            </div>
          </div>

          <div class="form-group">
            <label for="estado">Estado (UF) *</label>
            <div class="input-wrapper">
              <select id="estado" name="estado" required>
                <option value="SP" selected>SP</option>
                <option value="RJ">RJ</option>
                <option value="MG">MG</option>
                <option value="PR">PR</option>
                <option value="RS">RS</option>
                <option value="SC">SC</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <!-- Seção 4: Mensagem / Observações -->
      <section class="form-section">
        <h2 class="section-title">
          <i data-lucide="message-square"></i>
          4. Observações
        </h2>

        <div class="form-group">
          <label for="mensagem">Descrição do Negócio / Necessidades</label>
          <textarea id="mensagem" name="mensagem" rows="3" placeholder="Insira detalhes adicionais sobre sua empresa...">Empresa focada no desenvolvimento de softwares de gestão empresarial e soluções na nuvem.</textarea>
        </div>
      </section>

      <!-- Envio -->
      <div class="actions">
        <button type="submit" id="btn-submit">
          <i data-lucide="send" id="btn-icon"></i>
          <span id="btn-text">Cadastrar Empresa</span>
        </button>

        <div id="aviso" class="aviso hidden"></div>
      </div>

    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
